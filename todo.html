<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .add-task {
            display: flex;
            padding: 20px;
            gap: 12px;
            border-bottom: 1px solid #eee;
        }

        .add-task input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .add-task input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .add-task button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-task button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .add-task button:active {
            transform: translateY(0);
        }

        .task-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .task-list:empty::after {
            content: 'No tasks yet. Add one above!';
            display: block;
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 15px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        .task-item:hover {
            background-color: #f9f9f9;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #aaa;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #ddd;
            border-radius: 50%;
            margin-right: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox:hover {
            border-color: #667eea;
        }

        .task-item.completed .checkbox {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }

        .checkbox::after {
            content: '';
            width: 8px;
            height: 5px;
            border: 2px solid white;
            border-top: none;
            border-right: none;
            transform: rotate(-45deg);
            opacity: 0;
            margin-top: -2px;
        }

        .task-item.completed .checkbox::after {
            opacity: 1;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            word-break: break-word;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: #fee;
            color: #e74c3c;
        }

        .footer {
            padding: 16px 20px;
            background: #f9f9f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #888;
        }

        .clear-completed {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .clear-completed:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .clear-completed:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>To Do List</h1>
            <p id="date"></p>
        </div>
        
        <div class="add-task">
            <input type="text" id="taskInput" placeholder="Add a new task..." autofocus>
            <button id="addBtn">Add</button>
        </div>
        
        <ul class="task-list" id="taskList"></ul>
        
        <div class="footer">
            <span id="taskCount">0 tasks</span>
            <button class="clear-completed" id="clearBtn">Clear completed</button>
        </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const taskCount = document.getElementById('taskCount');
        const clearBtn = document.getElementById('clearBtn');
        const dateEl = document.getElementById('date');

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function formatDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('en-US', options);
        }

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function updateCount() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            taskCount.textContent = `${total} task${total !== 1 ? 's' : ''}${completed > 0 ? ` (${completed} done)` : ''}`;
            clearBtn.disabled = completed === 0;
        }

        function createTaskElement(task, index) {
            const li = document.createElement('li');
            li.className = `task-item${task.completed ? ' completed' : ''}`;
            li.innerHTML = `
                <div class="checkbox" data-index="${index}"></div>
                <span class="task-text">${escapeHtml(task.text)}</span>
                <button class="delete-btn" data-index="${index}">&times;</button>
            `;
            return li;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                taskList.appendChild(createTaskElement(task, index));
            });
            updateCount();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ text, completed: false });
                saveTasks();
                renderTasks();
                taskInput.value = '';
                taskInput.focus();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        function clearCompleted() {
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            renderTasks();
        }

        dateEl.textContent = formatDate();

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        taskList.addEventListener('click', (e) => {
            const index = parseInt(e.target.dataset.index);
            if (e.target.classList.contains('checkbox')) {
                toggleTask(index);
            } else if (e.target.classList.contains('delete-btn')) {
                deleteTask(index);
            }
        });

        clearBtn.addEventListener('click', clearCompleted);

        renderTasks();
    </script>
</body>
</html>
